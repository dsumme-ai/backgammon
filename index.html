<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backgammon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backgammon">
<meta name="theme-color" content="#14110e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="board"></div>
  <div id="panel">
    <div id="msg"></div>
    <div id="actions">
      <button id="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
      <button id="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg><span>Hint</span></button>
      <button id="new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg><span>New game</span></button>
    </div>
    <div id="level" role="group" aria-label="Difficulty">
      <button data-level="easy">Easy</button>
      <button data-level="medium">Medium</button>
      <button data-level="hard">Hard</button>
    </div>
    <div id="info"><span id="pips"></span><span id="stats"></span></div>
  </div>
  <div id="banner" hidden>
    <div class="card">
      <div id="bannerText"></div>
      <button id="again">Play again</button>
    </div>
  </div>
</div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
